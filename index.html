<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camino de Girasoles 🌻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Círculo del toque -->
  <div id="touch-circle"></div>

  <!-- Estrellas de fondo -->
  <div id="stars-container"></div>

  <!-- Girasoles -->
  <div id="sunflower-container"></div>

  <!-- Pétalos cayendo -->
  <div id="petals-container"></div>

  <!-- Sección final -->
  <div id="final-section">
    <div id="big-sunflower">🌻</div>
    <div id="message-box">
      <p class="date">21 de septiembre</p>
      <h2>Caminé hasta el centro del campo</h2>
      <p>Recorrí un campo sin final,<br>y cada girasol giró para verte pasar.</p>
      <p>Porque hasta las flores saben<br>hacia dónde mirar cuando llega la luz.</p>
      <p>Y mi luz, siempre, has sido tú.</p>
      <p class="final-line">Que la distancia no sea excusa para no dar flores amarillas 🌻</p>
      <button id="restart-btn">🔄 Volver a caminar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
