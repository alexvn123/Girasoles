<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camino de Girasoles 🌻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Círculo del toque / ratón -->
  <div id="touch-circle"></div>

  <!-- Cielo atardecer -->
  <div id="sky-gradient"></div>

  <!-- Sol poniente -->
  <div id="sun"></div>

  <!-- Nubes -->
  <div id="clouds-container"></div>

  <!-- Campo de girasoles -->
  <div id="sunflower-field"></div>

  <!-- Pétalos cayendo -->
  <div id="petals-container"></div>

  <!-- Mensaje final -->
  <div id="final-message">
    <div class="message-card">
      <p class="message-text">Que la distancia no sea excusa para no dar flores amarillas 🌻</p>
      <button id="restart-btn">🔄 Volver a ver</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
